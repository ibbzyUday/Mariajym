<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria, Be My Valentine? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fce4ec;
            --pink-medium: #f8bbd0;
            --pink-dark: #d81b60;
            --accent: #ff4081;
        }

        body {
            text-align: center;
            background: linear-gradient(135deg, var(--pink-light) 0%, var(--pink-medium) 100%);
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
            max-width: 500px;
            width: 90%;
            border: 2px solid white;
            transition: all 0.5s ease;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: var(--pink-dark);
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .bear {
            width: 220px;
            height: auto;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 100px;
        }

        .btn {
            font-size: 1.2rem;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .yes {
            background-color: var(--accent);
            color: white;
            z-index: 11;
        }

        .yes:hover {
            transform: scale(1.1);
            background-color: #f50057;
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.4);
        }

        .no {
            background-color: #f0f0f0;
            color: #757575;
            z-index: 10;
        }

        .heart {
            position: fixed;
            top: -50px;
            color: var(--accent);
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        #celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--pink-light) 0%, #fff 100%);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #celebration h2 {
            font-family: 'Pacifico', cursive;
            color: var(--pink-dark);
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        iframe {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="celebration">
        <h2>Yay! I love you! 💖</h2>
        <div id="finalVideo"></div>
    </div>

    <div class="container" id="mainContainer">
        <h1>Maria, will you be my Valentine? 💖</h1>
        <img src="media/kisses.gif" alt="Cute Bear" class="bear">
        <div class="buttons">
            <button class="btn yes" id="yes">Yes 💕</button>
            <button class="btn no" id="no">No 💔</button>
        </div>
    </div>

    <script>
        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");
        const mainContainer = document.getElementById("mainContainer");
        const celebration = document.getElementById("celebration");
        const finalVideo = document.getElementById("finalVideo");

        const messages = [
            "Are you sure?",
            "Really sure?",
            "Think about it...",
            "Last chance!",
            "You might regret this...",
            "Are you absolutely certain?",
            "You have a good heart, surely not?",
            "Don't be so cold...",
            "Change of heart?",
            "Is this your final answer?",
            "The bears will be heartbroken...",
            "You wrote love letters!",
            "I made you that really good pasta that one time!",
            "They will cry little bear tears!",
            "You're breaking boops little heart!",
            "Love is in the air, don’t resist it!"
        ];

        let index = 0;
        let yesSize = 1;

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createHeart, 400);

        noButton.addEventListener("click", () => {
            if (index < messages.length) {
                noButton.innerText = messages[index];
                index++;
                yesSize += 0.2;
                yesButton.style.transform = `scale(${yesSize})`;
            }
        });

        noButton.addEventListener("mouseover", () => {
            if (index >= 5) {
                const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
                const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
                noButton.style.position = 'fixed';
                noButton.style.left = x + 'px';
                noButton.style.top = y + 'px';
            }
        });

        yesButton.addEventListener("click", () => {
            mainContainer.style.opacity = '0';
            setTimeout(() => {
                mainContainer.style.display = 'none';
                celebration.style.display = 'flex';

                const video = document.createElement('iframe');
                video.width = '560';
                video.height = '315';
                video.src = 'https://www.youtube.com/embed/DeggZZLnyHU?autoplay=1&rel=0';
                video.frameBorder = '0';
                video.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                video.allowFullscreen = true;
                finalVideo.appendChild(video);

                for (let i = 0; i < 100; i++) {
                    setTimeout(createHeart, i * 20);
                }
            }, 500);
        });
    </script>
</body>
</html>
